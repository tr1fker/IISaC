    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 20
  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth
      DB_USER: auth
      DB_PASSWORD: auth
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-lab-demo-secret-change-this-to-at-least-32-bytes}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      SESSION_SECONDS: ${SESSION_SECONDS:-3600}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
  gateway:
    build: .
    ports:
      - "18080:8080"
    environment:
      AUTH_URL: http://auth-service:8081
    depends_on:
      auth-service:
        condition: service_started
volumes:
  kafka-data:
  auth-data:
  identity-data:
  merchant-data:
  payment-data:
  paymentmethod-data:
  account-data:
  refund-data:
  transaction-data:
  notification-data:
  analytics-data:
  account-service-secret:
