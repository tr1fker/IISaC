      args:
        SERVICE: paymentmethod-app
    environment:
      DB_URL: jdbc:postgresql://paymentmethod-db:5432/paymentmethod
      DB_USER: paymentmethod
      DB_PASSWORD: paymentmethod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
    depends_on:
      paymentmethod-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  security-init:
    image: postgres:16-alpine
    entrypoint: ["sh", "-c"]
    command: ["umask 077; if [ ! -s /run/lab-secrets/account ]; then head -c 32 /dev/urandom | base64 > /run/lab-secrets/account; fi; chmod 444 /run/lab-secrets/account"]
    volumes:
      - account-service-secret:/run/lab-secrets
  account-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    volumes:
      - account-data:/var/lib/postgresql/data
      - ./db/account/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account"]
      interval: 5s
      timeout: 5s
      retries: 20
  account-service:
    build:
      context: .
      args:
        SERVICE: account-app
    environment:
      DB_URL: jdbc:postgresql://account-db:5432/account
      DB_USER: account
      DB_PASSWORD: account
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
      ACCOUNT_SERVICE_SECRET_FILE: /run/lab-secrets/account
    volumes:
      - account-service-secret:/run/lab-secrets:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      account-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  refund-db:
