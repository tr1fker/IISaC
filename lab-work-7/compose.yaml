  analytics-service:
    build:
      context: .
      args:
        SERVICE: analytics-app
    environment:
      DB_URL: jdbc:postgresql://analytics-db:5432/analytics
      DB_USER: analytics
      DB_PASSWORD: analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
