services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./db/identity/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 20
  identity-service:
    build:
      context: .
      args:
        SERVICE: identity-app
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity
      DB_USER: identity
      DB_PASSWORD: identity
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  merchant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merchant
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: merchant
    volumes:
      - merchant-data:/var/lib/postgresql/data
      - ./db/merchant/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant -d merchant"]
      interval: 5s
      timeout: 5s
      retries: 20
  merchant-service:
    build:
      context: .
      args:
        SERVICE: merchant-app
    environment:
      DB_URL: jdbc:postgresql://merchant-db:5432/merchant
      DB_USER: merchant
      DB_PASSWORD: merchant
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
    depends_on:
      merchant-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - payment-data:/var/lib/postgresql/data
      - ./db/payment/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 20
  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-app
    environment:
      DB_URL: jdbc:postgresql://payment-db:5432/payment
      DB_USER: payment
      DB_PASSWORD: payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
      ACCOUNT_SERVICE_SECRET_FILE: /run/lab-secrets/account
    volumes:
      - account-service-secret:/run/lab-secrets:ro
    depends_on:
      security-init:
        condition: service_completed_successfully
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  paymentmethod-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentmethod
      POSTGRES_USER: paymentmethod
      POSTGRES_PASSWORD: paymentmethod
    volumes:
      - paymentmethod-data:/var/lib/postgresql/data
      - ./db/paymentmethod/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
