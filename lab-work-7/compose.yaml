  transaction-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transaction
      POSTGRES_USER: transaction
      POSTGRES_PASSWORD: transaction
    volumes:
      - transaction-data:/var/lib/postgresql/data
      - ./db/transaction/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction -d transaction"]
      interval: 5s
      timeout: 5s
      retries: 20
  transaction-service:
    build:
      context: .
      args:
        SERVICE: transaction-app
    environment:
      DB_URL: jdbc:postgresql://transaction-db:5432/transaction
      DB_USER: transaction
      DB_PASSWORD: transaction
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
    depends_on:
      transaction-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    volumes:
      - notification-data:/var/lib/postgresql/data
      - ./db/notification/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 5s
      retries: 20
  notification-service:
    build:
      context: .
      args:
        SERVICE: notification-app
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification
      DB_USER: notification
      DB_PASSWORD: notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-lab6-internal-demo-secret}
      AUTH_URL: http://auth-service:8081
    depends_on:
