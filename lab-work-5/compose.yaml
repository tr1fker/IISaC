  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth
      DB_USER: auth
      DB_PASSWORD: auth
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-lab-demo-secret-change-this-to-at-least-32-bytes}
      SESSION_SECONDS: ${SESSION_SECONDS:-3600}
    volumes:
      - mock-bus:/mock-bus
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
  gateway:
    build: .
    ports:
      - "18080:8080"
    environment:
      AUTH_URL: http://auth-service:8081
    volumes:
      - mock-bus:/mock-bus
    depends_on:
      auth-service:
        condition: service_started
      identity-service:
        condition: service_started
      merchant-service:
        condition: service_started
      payment-service:
        condition: service_started
      paymentmethod-service:
        condition: service_started
      account-service:
        condition: service_started
      refund-service:
        condition: service_started
      transaction-service:
        condition: service_started
      notification-service:
        condition: service_started
      analytics-service:
        condition: service_started
volumes:
  identity-data:
  merchant-data:
  payment-data:
  paymentmethod-data:
  account-data:
  refund-data:
  transaction-data:
  notification-data:
  analytics-data:
  mock-bus:
  auth-data:
