services:
  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    volumes:
      - identity-data:/var/lib/postgresql/data
      - ./db/identity/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 5s
      retries: 20
  identity-service:
    build:
      context: .
      args:
        SERVICE: identity-service
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity
      DB_USER: identity
      DB_PASSWORD: identity
    volumes:
      - mock-bus:/mock-bus
    depends_on:
      identity-db:
        condition: service_healthy
