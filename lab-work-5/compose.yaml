services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USER: lab
      DB_PASSWORD: lab
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-lab-demo-secret-change-this-to-at-least-32-bytes}
      SESSION_SECONDS: ${SESSION_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  gateway:
    build: .
    ports:
      - "18080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USER: lab
      DB_PASSWORD: lab
      AUTH_URL: http://auth-service:8081
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_started
volumes:
  database:
